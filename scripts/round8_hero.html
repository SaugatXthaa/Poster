  <!-- ═══ TOP: POSTER ROW + MOVIES SECTION (topx, elfhosted-style layout) ══
       Two ranked covers side by side (the live preview + the next rank),
       then the MOVIES block with the shape pills and the canvas style chips,
       then the Configuration panel below. Normal flow — nothing floats. -->
  <div class="topx-hero" id="topx-hero">
    <div class="topx-posters" id="topx-posters">

      <!-- Card A: the locked live preview (verbatim frame + wiring). -->
      <div class="topx-poster-card" id="tx-card-a">
        <div class="preview-frame" id="preview-frame">
          <div class="preview-empty preview-placeholder" id="preview-empty">
            <span class="preview-placeholder-title">Poster preview</span>
            <span class="preview-placeholder-dim" id="preview-placeholder-dim">1000 &times; 1500</span>
          </div>
        </div>
        <!-- Portrait / landscape state.  The checkbox is the state — it rides
             through build() as shape=landscape, and so through the saved
             settings and Reset like every other tog- control; the MOVIES
             shape pills below only mirror and flip it. -->
        <input type="checkbox" id="tog-landscape" hidden>
        <!-- Into the admin dashboard's artwork editor for this title.  Only
             when the operator turned it on there (off by default). -->
        <a class="icon-btn" id="artwork-edit-link" hidden
           aria-label="Edit this title's artwork in the admin dashboard"
           data-tip="Choose this title's poster, logo and landscape art for everyone, in the admin dashboard.">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(1.5 0)"><rect x="3" y="3" width="13" height="18" rx="2"/><path d="M3 15l4-4 4 4"/><path d="M14.5 13.5l6-6a1.4 1.4 0 0 0-2-2l-6 6-.8 2.8z"/></g></svg>
        </a>
        <!-- Report this poster to the operator (REPORTS_ENABLED). -->
        <button type="button" class="icon-btn" id="report-poster" hidden
                aria-label="Report a problem with this poster"
                data-tip="Report a problem with this poster to whoever runs this instance: text on a textless poster, the wrong art or logo, wrong details."
                onclick="openReportModal()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 20.5v-17"/><path d="M6.5 3.5h11l-2 4.25 2 4.25h-11"/></svg>
        </button>
      </div>

      <!-- Card B: the next rank of the same chart, same settings. -->
      <div class="topx-poster-card" id="tx-card-b">
        <div class="preview-frame topx-frame-b" id="tx-frame-b">
          <img id="tx-poster-b" alt="Next rank preview" referrerpolicy="no-referrer" hidden>
          <div class="topx-b-ph" id="tx-b-ph">Next rank</div>
        </div>
      </div>

    </div>

    <!-- Caption + status + the verbatim header actions, in one slim row. -->
    <div class="topx-hero-meta">
      <!-- Errors surface here, directly under where the poster renders. -->
      <div class="preview-error" id="preview-error" hidden></div>
      <div class="tx-meta" id="tx-meta">—</div>
      <span class="topx-opt-status" id="tx-status">BOOT</span>
      <div class="topx-hero-icons">
        <!-- Opens #external-menu; hidden until a title is selected. -->
        <button type="button" class="icon-btn" id="external-link" hidden
                aria-haspopup="true" aria-expanded="false"
                aria-label="Open this title on IMDB or TMDB"
                data-tip="Open this title on IMDB or TMDB."
                onclick="toggleExternalMenu(event)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4l-8.5 8.5"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg>
        </button>
        <button type="button" class="icon-btn" id="import-url-btn"
                aria-label="Import settings from a config URL"
                data-tip="Import settings from a config URL."
                onclick="toggleImportBar()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>
        </button>
        <span class="panel-index" id="preview-status" hidden>IDLE</span>
      </div>
    </div>

    <!-- MOVIES: the shape pills and the canvas style chips, as on the
         example layout.  Both cards follow them live. -->
    <div class="topx-movies">
      <div class="topx-movies-label" id="tx-movies-label">MOVIES</div>
      <div class="topx-shape-row">
        <button type="button" class="topx-shape-pill tx-shape" data-qshape="landscape"
                data-tip="Preview the 16:9 landscape poster. Copy config then copies the landscape URL, for clients with a landscape poster slot.">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 14h18"/></svg>
          Landscape&ensp;16:9
        </button>
        <span class="topx-shape-divider"></span>
        <button type="button" class="topx-shape-pill tx-shape" data-qshape="poster"
                data-tip="Preview the 2:3 portrait poster.">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18.5h2"/></svg>
          Poster&ensp;2:3
        </button>
      </div>
      <div class="topx-canvas-row" id="txCanvasRow">
        <button type="button" class="topx-canvas-chip active" data-canvas="fresh"
                data-tip="Full-bleed fresh artwork behind the ranked cover."><span class="txdot" style="background:#4caf7d"></span>Fresh</button>
        <button type="button" class="topx-canvas-chip" data-canvas="provider"
                data-tip="The streaming provider's own art, behind a glass tint."><span class="txdot" style="background:#59b7ff"></span>Provider Glass</button>
        <button type="button" class="topx-canvas-chip" data-canvas="transparent"
                data-tip="Transparent canvas — the ranked cover floats on the client's own background."><span class="txdot txdot-transparent"></span>Transparent</button>
        <button type="button" class="topx-canvas-chip" data-canvas="stremio"
                data-tip="Stremio navy canvas."><span class="txdot" style="background:#8c75ff"></span>Stremio</button>
        <button type="button" class="topx-canvas-chip" data-canvas="black"
                data-tip="Solid black canvas."><span class="txdot" style="background:#1a1a1a"></span>Black</button>
      </div>
    </div>

    <!-- Output: the verbatim action buttons and URL box, unchanged. -->
    <div class="preview-actions">
      <button class="btn btn-preview" id="copy-config-btn" onclick="copyUrl()"
        oncontextmenu="return openCopyMenu(event)"
        aria-haspopup="true" aria-expanded="false"
        data-tip="Left-click to copy the URL for AIOMetadata, Nuvio, Bingecat and Xperience — one URL covers portrait and landscape. Right-click or long press to copy the config for Discover+, share your config securely, or send it straight to AIOMetadata.">Copy config</button>
      <button class="btn btn-primary" onclick="openPresetModal()"
        data-tip="Replace the current settings with a saved preset.">Load preset</button>
      <button class="btn btn-reset" onclick="resetDefaults(); build(); queuePreviewReload(); saveApiKeys()"
        data-tip="Return every setting to its default. Your API keys, language and selected title are kept. To reset one tab or group, right-click (or press and hold) its tab or heading.">Reset config</button>
    </div>
    <div class="preview-controls">
      <div id="url-display-row">
        <input type="text" id="url-display-input" readonly
               onclick="this.select()"
               title="Click to select all, then Ctrl+C to copy">
      </div>
    </div>
  </div>

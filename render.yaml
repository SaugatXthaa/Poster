# Render.com Blueprint — deploy with one click
# https://render.com/docs/blueprint-spec
#
# TOPX Posters+ runs the Posters Plus render pipeline (Python / FastAPI /
# Pillow) with the TOPX and BLVCKTOP poster templates added on top.  The
# image is built from the project's own dockerfile; Render injects PORT and
# entrypoint.sh binds to it.
#
# After the first deploy, set TMDB_API_KEY in the dashboard
# (Environment → Environment Variables) with your own key from
# https://www.themoviedb.org/settings/api.  MDBLIST_API_KEY is optional:
# it drives the weighted score (the ★ rating) and the award data.
#
# The free plan has no persistent disk: the render caches in /app/cache are
# ephemeral and warm up again after a restart.  On a paid plan attach a disk
# like the commented block below for instant cache hits.

services:
  - type: web
    name: topx-posters
    runtime: docker
    dockerfilePath: ./dockerfile
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: TMDB_API_KEY
        sync: false                  # ← paste your TMDB key in the dashboard
      - key: MDBLIST_API_KEY
        sync: false                  # optional — weighted score + awards
    # disk:
    #   name: topx-cache
    #   mountPath: /app/cache
    #   sizeGB: 1

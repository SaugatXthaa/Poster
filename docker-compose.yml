services:
  topx-posters:
    build: .
    image: topx-posters:latest
    container_name: topx-posters
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    healthcheck:
      # node:20-bookworm-slim ships no wget/curl — use node's global fetch.
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/manifest.json').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

# Render.com Blueprint — deploy with one click
# https://render.com/docs/blueprint-spec
#
# Deploys TOPX Posters as a Docker web service. Render auto-detects PORT;
# the app binds to it (see server.js: process.env.PORT || 3000).
#
# After the first deploy, set TMDB_API_KEY in the dashboard
# (Environment → Environment Variables) with your own key from
# https://www.themoviedb.org/settings/api — the demo key works but is
# heavily rate-limited.

services:
  - type: web
    name: topx-posters
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /manifest.json
    envVars:
      - key: APP_SECRET
        generateValue: true          # long random secret, stable across restarts
      - key: TMDB_API_KEY
        sync: false                  # ← paste your TMDB key in the dashboard
      - key: NODE_ENV
        value: production
      - key: MALLOC_ARENA_MAX
        value: "2"
    # Free plan has no persistent disk: the SQLite cache + rendered covers in
    # /app/data are ephemeral and regenerate on demand after a restart.
    # On a paid plan you can attach a disk like this for instant cache hits:
    # disk:
    #   name: topx-data
    #   mountPath: /app/data
    #   sizeGB: 1

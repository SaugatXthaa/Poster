# nginx reverse proxy for Cinejoy CDN
# Injects the required Referer header on every request, so Stremio / any HLS
# player can play the streams without setting custom headers.
#
# Usage:
#   1. Drop this file in /etc/nginx/sites-available/cinejoy-proxy.conf
#   2. ln -s /etc/nginx/sites-available/cinejoy-proxy.conf /etc/nginx/sites-enabled/
#   3. nginx -t && systemctl reload nginx
#   4. Rewrite your stream URLs from:
#        https://help.earthcleaner.cc/video/9937486/video_1080p.m3u8
#      to:
#        https://your-domain/cinejoy/video/9937486/video_1080p.m3u8
#      (use sed/regex in your scraper)

server {
    listen 80;
    listen 443 ssl;
    server_name your-domain.example.com;

    # SSL config (use certbot to provision)
    # ssl_certificate /etc/letsencrypt/live/your-domain.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/your-domain.example.com/privkey.pem;

    # Permissive CORS for HLS players
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "*" always;

    # Cinejoy video CDN proxy
    location /cinejoy/ {
        # Strip /cinejoy/ prefix and proxy to the real CDN
        proxy_pass https://help.earthcleaner.cc/;

        # REQUIRED — Cinejoy's CDN gate (without this you get HTTP 418)
        proxy_set_header Referer https://cinejoy.to/;
        proxy_set_header Origin https://cinejoy.to;

        # Real client UA (or spoof a desktop browser)
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";

        # TLS SNI
        proxy_ssl_server_name on;
        proxy_ssl_name help.earthcleaner.cc;

        # Streaming-friendly settings
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        # Pass through content-type (segments are .html but actually video/mp4)
        proxy_pass_header Content-Type;
        proxy_pass_header Content-Length;
    }

    # AniLibria (Antova) CDN proxy — typically NOT needed (no special headers)
    # but kept here in case Cloudflare blocks your server IP
    location /anilibria/ {
        proxy_pass https://cache.libria.fun/;
        proxy_set_header User-Agent "Mozilla/5.0 ...";
        proxy_ssl_server_name on;
        proxy_ssl_name cache.libria.fun;
        proxy_buffering off;
    }
}
